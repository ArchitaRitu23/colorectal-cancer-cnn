    <form class="row g-3" action="/register" method="post">
      {% csrf_token %}
      <!-- <center>
                    <p style="color: white(0, 0, 0);">{{msg}}</p>
                </center> -->

      <div class="col-md-6">
        <div class="form-outline mb-4">
          <label class="form-label" for="form3Example1cg" style="color: white;">Your
            Name</label>
          <input type="text" name="name" id="form3Example1cg" class="form-control" placeholder="Your Name" />
        </div>

        <div class="form-outline mb-4">
          <label class="form-label" for="form3Example3cg" style="color: white;">Your
            Email</label>
          <input type="email" name="email" id="form3Example3cg" class="form-control" placeholder="Your Email" />
        </div>

        <div class="form-outline mb-4">
          <label class="form-label" for="form3Example4cg" style="color: white;">Password</label>
          <input type="password" name="password" id="form3Example4cg" class="form-control" placeholder="Password" />
        </div>
      </div>

      <div class="col-md-6">
        <div class="form-outline mb-4">
          <label class="form-label" for="form3Example4cdg" style="color: white;">Repeat your password</label>
          <input type="password" name="conpassword" id="form3Example4cdg" class="form-control"
            placeholder="Repeat your Password" />
        </div>

        <div class="form-outline mb-4">
          <label class="form-label" for="form3Example4cdg" style="color: white;">Age</label>
          <input type="number" name="Age" id="form3Example4cdg" class="form-control" placeholder="Age" />
        </div>

        <div class="form-outline mb-4">
          <label class="form-label" for="form3Example4cdg" style="color: white;">contact</label>
          <input type="number" name="contact" pattern="[0-9]{10}" id="form3Example4cdg" class="form-control"
            placeholder="contact" required />
        </div>
      </div>

      <div class="d-flex justify-content-center">
        <center> <button type="submit" class="btn btn-success">Register</button></center>
      </div>
      <h1>{{msg}}</h1>
    </form>
